name: ✨ 새로운 기능 (feat)
description: 새로운 기능 추가에 대한 이슈
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능을 추가하는 작업입니다.
        커밋 메시지: `feat: 기능 설명`
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 추가할 기능에 대한 명확하고 간결한 설명을 작성해주세요.
      placeholder: 예: 타이머 시작/일시정지/종료 API 구현
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 동기 / 필요성
      description: 이 기능이 필요한 이유를 설명해주세요.
      placeholder: 사용자가 취미 활동 시간을 측정하고 기록할 수 있어야 합니다.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: 구현 계획
      description: 기능을 어떻게 구현할지 계획을 작성해주세요.
      placeholder: |
        - 타이머 시작 API 엔드포인트 생성
        - 타이머 상태를 저장할 엔티티 설계
        - 일시정지/재개 로직 구현
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 기능이 완료되었다고 판단할 수 있는 조건을 작성해주세요.
      placeholder: |
        - [ ] API 엔드포인트가 정상 동작
        - [ ] 단위 테스트 작성 및 통과
        - [ ] API 문서 업데이트
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 관련 이슈
      description: 관련된 다른 이슈나 PR이 있다면 링크해주세요.
      placeholder: Closes #123, Related to #456

