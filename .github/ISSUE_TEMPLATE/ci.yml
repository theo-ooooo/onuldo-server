name: 🔧 CI (ci)
description: CI 관련 설정 수정에 대한 이슈
title: "[ci] "
labels: ["ci"]
body:
  - type: markdown
    attributes:
      value: |
        CI 관련 설정을 수정하는 작업입니다.
        커밋 메시지: `ci: CI 수정 설명`
  - type: dropdown
    id: ci_type
    attributes:
      label: CI 수정 유형
      description: 어떤 CI 관련 작업인지 선택해주세요.
      options:
        - GitHub Actions 워크플로우 추가/수정
        - CI 스크립트 수정
        - CI 환경 변수 설정
        - 배포 파이프라인 수정
        - 기타
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: CI 수정 설명
      description: CI 관련 어떤 설정을 어떻게 수정할지 설명해주세요.
      placeholder: 예: GitHub Actions에 자동 테스트 워크플로우 추가
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 변경 사항
      description: 구체적인 변경 내용을 작성해주세요.
      placeholder: |
        - .github/workflows/test.yml 파일 생성
        - PR 생성 시 자동으로 테스트 실행
        - 테스트 실패 시 PR 머지 차단
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 관련 이슈
      description: 관련된 다른 이슈나 PR이 있다면 링크해주세요.
      placeholder: Related to #123

