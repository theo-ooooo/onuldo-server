name: 📝 문서 수정 (docs)
description: 문서 수정에 대한 이슈
title: "[docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        문서를 수정하는 작업입니다.
        커밋 메시지: `docs: 문서 수정 설명`
  - type: dropdown
    id: doc_type
    attributes:
      label: 문서 유형
      description: 수정할 문서의 유형을 선택해주세요.
      options:
        - README
        - API 문서
        - 개발 가이드
        - 코딩 컨벤션
        - 배포 가이드
        - 주석
        - 기타
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문서 수정 설명
      description: 어떤 문서를 어떻게 수정할지 설명해주세요.
      placeholder: 예: README에 프로젝트 설정 방법 추가
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: 추가/수정할 내용
      description: 문서에 추가하거나 수정할 내용을 작성해주세요.
      placeholder: |
        ## 설치 방법
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 관련 이슈
      description: 관련된 다른 이슈나 PR이 있다면 링크해주세요.
      placeholder: Related to #123

