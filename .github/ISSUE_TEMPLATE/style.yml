name: 💅 코드 스타일 (style)
description: 코드 스타일 또는 포맷 수정에 대한 이슈
title: "[style] "
labels: ["style"]
body:
  - type: markdown
    attributes:
      value: |
        코드 스타일이나 포맷을 수정하는 작업입니다.
        커밋 메시지: `style: 스타일 수정 설명`
  - type: textarea
    id: description
    attributes:
      label: 스타일 수정 설명
      description: 어떤 스타일을 어떻게 수정할지 설명해주세요.
      placeholder: 예: 전체 프로젝트에 Kotlin 코딩 컨벤션 적용
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 변경 사항
      description: 구체적인 변경 내용을 작성해주세요.
      placeholder: |
        - 들여쓰기 통일 (4 spaces)
        - import 정렬
        - 불필요한 공백 제거
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking Changes
      description: 이 스타일 변경이 코드 동작에 영향을 주는지 체크해주세요.
      options:
        - label: 코드 동작에 영향을 주지 않습니다 (포맷팅만)
  - type: textarea
    id: related
    attributes:
      label: 관련 이슈
      description: 관련된 다른 이슈나 PR이 있다면 링크해주세요.
      placeholder: Related to #123

