spring:
  # 테스트용 H2 Database
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Redis 테스트용 설정
  data:
    redis:
      host: localhost
      port: 6379

# JWT 테스트용 설정
jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-32-bytes
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 86400

# AWS S3 테스트용 설정
aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    base-url: https://test-bucket.s3.ap-northeast-2.amazonaws.com

# FCM 테스트용 설정
fcm:
  credentials-path: test-credentials.json

